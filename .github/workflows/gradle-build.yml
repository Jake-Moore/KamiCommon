name: Gradle Build (on PR)

on:
  pull_request:
    branches:
      # main is the timeline and carries no CI/CD responsibility. Everything that needs validating
      # happens on a release line, and the sync from release/v5 to main is a fast-forward.
      - "release/**"

jobs:
  build:

    runs-on: ubuntu-latest
    permissions:
      contents: write # Access to Publish a Release
      packages: write # Access to Publish a Package

    #------------------------------------------------------------------------#
    #           Build the Artifact to test PR changes before merge           #
    #------------------------------------------------------------------------#
    steps:
    - uses: actions/checkout@v6
    
    - name: Set up JDKs 17, 21 and 25
      uses: actions/setup-java@v5
      with:
        java-version: |
          17
          21
          25
        distribution: 'temurin'
        server-id: github # Value of the distributionManagement/repository/id field of the pom.xml
        settings-path: ${{ github.workspace }} # location for the settings.xml file

    # Configure: https://github.com/gradle/actions/blob/main/setup-gradle/README.md
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
      with:
        # Follow the wrapper rather than pinning. These were pinned to 9.0.0 while the wrapper
        # said something else, so CI and local builds ran different Gradle versions and a
        # wrapper bump could never affect CI. That is why the shadow 9.6.1 update stayed red
        # even once the wrapper bump was in the same PR.
        gradle-version: wrapper

    - name: Build with Gradle (1.8.8)
      run: gradle build
      env:
        LUXIOUS_NEXUS_USER: ${{ secrets.MAVEN_NAME }}
        LUXIOUS_NEXUS_PASS: ${{ secrets.MAVEN_SECRET }}
        MC_SERVER_NEWEST_API: "false"

    - name: Build with Gradle (newest Paper API)
      run: gradle build
      env:
        LUXIOUS_NEXUS_USER: ${{ secrets.MAVEN_NAME }}
        LUXIOUS_NEXUS_PASS: ${{ secrets.MAVEN_SECRET }}
        MC_SERVER_NEWEST_API: "true"