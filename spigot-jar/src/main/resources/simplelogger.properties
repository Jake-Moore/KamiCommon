# Configuration for the RELOCATED copy of slf4j-simple that ships inside this plugin.
#
# The provider registration was broken until it was fixed alongside mergeServiceFiles(), so this
# logger has never actually emitted anything. Turning it on at slf4j-simple's default level of INFO
# would have started printing lettuce, netty and rabbitmq chatter to System.err on every server, so
# the default is raised to warn: genuine problems become visible, routine operation stays quiet.
#
# The key prefix is the RELOCATED one. Shadow rewrites the property-name string constants inside
# SimpleLoggerConfiguration but leaves this file alone, so a key written as org.slf4j.* would be read
# by nobody and silently do nothing. verifyShading asserts the prefix here still matches the one
# compiled into the relocated class.
com.kamikazejam.kamicommon.slf4j.simpleLogger.defaultLogLevel=warn
